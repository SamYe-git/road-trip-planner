<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Trip Planner</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#2a2826" stroke-width="1" opacity=".22"/></pattern>
    <pattern id="velour" width="10" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="2.5" x2="10" y2="2.5" stroke="#2a2826" stroke-width="1" opacity=".3"/></pattern>
  </defs>
</svg>

<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">Road trip planner</div>
      <h1>Every leg.<br><em>Not just the total.</em></h1>
    </div>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>

  <main>
    <!-- Screen 1: the cab -->
    <section class="cab" id="cab" aria-label="Truck cab">
      <svg viewBox="0 0 1200 640" role="img" aria-label="Pencil sketch of a 1980s 4x4 cab with a folded road map on the dashboard">
        <!-- windshield view -->
        <rect x="0" y="0" width="1200" height="640" fill="#f4f2ec"/>
        <g filter="url(#pencil)" fill="none" stroke="#2a2826" stroke-linecap="round" stroke-linejoin="round">
          <path d="M60 40 Q600 10 1140 40 L1110 250 Q600 230 90 250 Z" stroke-width="3"/>
          <polyline points="90,205 210,130 290,170 400,95 520,160 610,120 700,170 820,105 930,165 1040,125 1110,190" stroke="#4c5a3a" stroke-width="2"/>
          <polyline points="150,215 260,170 360,200 470,150 560,195" stroke="#4c5a3a" stroke-width="1.4" opacity=".7"/>
          <polyline points="700,200 800,160 900,195 1000,165 1080,205" stroke="#4c5a3a" stroke-width="1.4" opacity=".7"/>
          <path d="M600 160 L470 250 M600 160 L730 250" stroke-width="2"/>
          <path d="M600 175 L600 186 M600 200 L600 214 M600 228 L600 246" stroke="#d49b1a" stroke-width="3"/>
          <path d="M120 238 Q300 225 470 236" stroke="#4f7891" stroke-width="1.6"/>
          <path d="M250 248 L520 205 M700 248 L960 210" stroke-width="2.5"/>
        </g>

        <!-- dashboard -->
        <g filter="url(#pencil)" stroke="#2a2826" stroke-linejoin="round">
          <path d="M0 250 Q600 222 1200 250 L1200 400 Q600 380 0 400 Z" fill="#b0946a" stroke-width="3"/>
          <path d="M0 250 Q600 222 1200 250 L1200 400 Q600 380 0 400 Z" fill="url(#hatch)" stroke="none"/>
          <rect x="120" y="262" width="330" height="110" rx="14" fill="#2a2826" stroke-width="3"/>
          <g fill="none" stroke="#f4f2ec" stroke-width="1.6">
            <circle cx="200" cy="318" r="34"/><circle cx="295" cy="318" r="40"/><circle cx="390" cy="318" r="34"/>
            <path d="M200 318 L222 300 M295 318 L270 290 M390 318 L410 330"/>
          </g>
          <path d="M520 262 L540 222 L700 222 L720 262 Z" fill="#b0946a" stroke-width="3"/>
          <rect x="548" y="230" width="144" height="28" rx="4" fill="#2a2826"/>
          <g fill="none" stroke="#d49b1a" stroke-width="1.6"><path d="M560 252 Q585 234 610 252"/><path d="M632 252 Q657 234 682 252"/></g>
          <g fill="#2a2826"><rect x="520" y="275" width="70" height="40" rx="5"/><rect x="610" y="275" width="70" height="40" rx="5"/><rect x="1090" y="270" width="80" height="40" rx="5"/></g>
          <g stroke="#b0946a" stroke-width="2"><path d="M528 287 H582 M528 297 H582 M528 307 H582 M618 287 H672 M618 297 H672 M618 307 H672 M1098 282 H1162 M1098 292 H1162 M1098 302 H1162"/></g>
          <rect x="520" y="325" width="160" height="38" rx="4" fill="#2a2826"/>
          <rect x="545" y="335" width="80" height="18" fill="#4f7891" opacity=".8"/>
          <rect x="760" y="300" width="300" height="70" rx="8" fill="none" stroke-width="2.4"/>
          <circle cx="1020" cy="335" r="9" fill="none" stroke-width="2"/>
        </g>

        <!-- steering wheel -->
        <g filter="url(#pencil)" stroke="#2a2826" fill="none" stroke-linecap="round">
          <circle cx="285" cy="470" r="175" stroke-width="22"/>
          <circle cx="285" cy="470" r="175" stroke-width="2"/>
          <path d="M285 470 L130 520 M285 470 L440 520 M285 470 L285 640" stroke-width="16"/>
          <rect x="215" y="425" width="140" height="80" rx="18" fill="#b0946a" stroke-width="2.4"/>
          <rect x="248" y="452" width="74" height="22" rx="3" fill="#f4f2ec" stroke-width="1.2"/>
          <text x="285" y="468" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="14" fill="#2a2826" stroke="none" letter-spacing="2">4 X 4</text>
        </g>

        <!-- console and shifter -->
        <g filter="url(#pencil)" stroke="#2a2826" stroke-linecap="round">
          <path d="M540 400 L680 400 L720 640 L500 640 Z" fill="#b0946a" stroke-width="2.4"/>
          <path d="M540 400 L680 400 L720 640 L500 640 Z" fill="url(#hatch)" stroke="none"/>
          <path d="M600 560 Q585 500 605 450" fill="none" stroke-width="7"/>
          <circle cx="607" cy="440" r="20" fill="#b0946a" stroke-width="2.4"/>
          <text x="607" y="445" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#f4f2ec" stroke="none">1 3 5</text>
          <path d="M640 560 Q640 520 652 500" fill="none" stroke-width="5"/>
          <rect x="642" y="482" width="18" height="24" rx="6" fill="#b0946a" stroke-width="2"/>
        </g>

        <!-- seats -->
        <g filter="url(#pencil)" stroke="#2a2826" stroke-width="2.4">
          <path d="M770 640 L780 470 Q785 430 830 428 L1020 428 Q1060 430 1062 470 L1070 640 Z" fill="#b0946a"/>
          <path d="M770 640 L780 470 Q785 430 830 428 L1020 428 Q1060 430 1062 470 L1070 640 Z" fill="url(#velour)"/>
          <path d="M850 440 L845 640 M990 440 L995 640" fill="none" opacity=".6"/>
          <path d="M0 640 L10 560 Q15 530 50 528 L80 528" fill="#b0946a"/>
        </g>

        <!-- the folded map: the one thing to click -->
        <g class="map-folded" id="openMap" role="button" tabindex="0" aria-label="Open the map to plan your trip">
          <circle cx="905" cy="352" r="96" fill="none" stroke="#c7361f" stroke-width="4" stroke-dasharray="10 8" opacity=".6"/>
          <g transform="rotate(-8 905 352)" filter="url(#pencil)">
            <rect x="830" y="300" width="150" height="105" fill="#f4f2ec" stroke="#2a2826" stroke-width="2.4"/>
            <path d="M880 300 L880 405 M930 300 L930 405 M830 352 L980 352" stroke="#2a2826" stroke-width="1.2" opacity=".5"/>
            <path d="M845 390 Q870 330 895 365 T950 320 T972 312" fill="none" stroke="#c7361f" stroke-width="3" stroke-dasharray="7 5"/>
            <path d="M840 330 Q860 318 880 328" fill="none" stroke="#4f7891" stroke-width="2"/>
            <text x="905" y="296" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="18" fill="#2a2826" letter-spacing="1">ROAD MAP</text>
          </g>
          <text x="905" y="470" text-anchor="middle" font-family="Bradley Hand, Segoe Print, cursive" font-size="22" fill="#2a2826">open the map</text>
        </g>
      </svg>
      <p class="cab-caption note">Click the map (or press Enter on it).</p>
    </section>

    <!-- Screen 2: the open map -->
    <section class="sheet" id="sheet" aria-label="Trip map" hidden>
      <div class="road" aria-hidden="true">
        <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
          <g filter="url(#pencil)" fill="none" stroke="#2a2826">
            <polyline points="0,62 90,40 160,55 250,22 330,48 420,30 520,58 600,26 690,50 780,20 870,46 1000,30" stroke="#4c5a3a" stroke-width="1.6" opacity=".7"/>
            <path d="M0 96 H1000" stroke-width="2.4"/>
            <path d="M0 108 H1000" stroke-width="1.2" stroke-dasharray="16 12" opacity=".7"/>
          </g>
        </svg>
        <svg class="truck" viewBox="0 0 220 90">
          <g filter="url(#pencil)" stroke="#2a2826" stroke-width="2" stroke-linejoin="round">
            <path d="M14 58 L14 38 Q16 30 26 30 L120 30 L120 12 Q122 8 128 8 L160 8 Q166 9 172 18 L186 34 L204 38 Q210 40 210 48 L210 62 L14 62 Z" fill="#c7361f"/>
            <path d="M14 30 L14 14 Q15 8 22 8 L120 8 L120 30 Z" fill="#2a2826"/>
            <path d="M128 12 L158 12 L176 32 L128 32 Z" fill="#4f7891" fill-opacity=".45"/>
            <path d="M60 12 L112 12 L112 28 L60 28 Z M24 12 L54 12 L54 28 L24 28 Z" fill="#6d6a63"/>
            <path d="M18 44 L206 44 M18 49 L206 49" stroke="#d49b1a" stroke-width="2.4"/>
            <circle cx="58" cy="64" r="17" fill="#2a2826"/><circle cx="58" cy="64" r="8" fill="#e9e5da"/>
            <circle cx="170" cy="64" r="17" fill="#2a2826"/><circle cx="170" cy="64" r="8" fill="#e9e5da"/>
          </g>
        </svg>
      </div>

      <form class="controls" id="tripForm" novalidate>
        <div class="field">
          <label for="from">Start</label><input id="from" autocomplete="off" placeholder="Try Wellesley">
          <div class="results" id="fromResults" aria-live="polite"></div>
          <span class="err" id="fromErr" hidden></span>
        </div>
        <div class="field">
          <label for="to">Destination</label><input id="to" autocomplete="off" placeholder="Try Stowe">
          <div class="results" id="toResults" aria-live="polite"></div>
          <span class="err" id="toErr" hidden></span>
        </div>
        <div class="field"><label for="leave">Leave</label><input id="leave" type="datetime-local"></div>
        <div class="field field-btn"><button type="submit" class="btn-solid">Plan trip</button></div>
      </form>

      <div class="terrain">
        <div class="edge left" aria-hidden="true">
          <svg viewBox="0 0 120 900" preserveAspectRatio="none"><g filter="url(#pencil)" fill="none" stroke-linecap="round">
            <polyline points="0,40 40,70 20,120 70,160 30,220 80,270 25,330 60,380 15,430 75,490 30,540 70,600 20,650 65,710 25,770 70,830 10,890" stroke="#2a2826" stroke-width="2"/>
            <polyline points="0,90 20,130 0,180 30,250 0,310 25,370 0,420" stroke="#4c5a3a" stroke-width="1.4" opacity=".7"/>
            <path d="M100 0 Q80 120 108 220 T96 440 T110 660 T92 900" stroke="#4f7891" stroke-width="2.2"/>
            <path d="M40 470 l10 -18 l10 18 M50 452 v26 M15 560 l10 -18 l10 18 M25 542 v26 M45 690 l10 -18 l10 18 M55 672 v26" stroke="#4c5a3a" stroke-width="1.6"/>
          </g></svg>
        </div>
        <div class="edge right" aria-hidden="true">
          <svg viewBox="0 0 120 900" preserveAspectRatio="none"><g filter="url(#pencil)" fill="none" stroke-linecap="round">
            <polyline points="0,20 50,60 15,110 80,150 35,200 95,260 40,320 85,370 20,440 70,500 35,560 90,620 30,680 75,740 20,800 60,860 0,900" stroke="#2a2826" stroke-width="2"/>
            <polyline points="0,60 25,110 0,170 35,230 0,280" stroke="#4c5a3a" stroke-width="1.4" opacity=".7"/>
            <path d="M106 0 Q90 160 112 300 T98 560 T112 900" stroke="#4f7891" stroke-width="2.2"/>
            <path d="M30 380 l10 -18 l10 18 M40 362 v26 M55 600 l10 -18 l10 18 M65 582 v26" stroke="#4c5a3a" stroke-width="1.6"/>
          </g></svg>
        </div>
        <div class="route" id="route" aria-live="polite"></div>
      </div>

      <div class="sheet-foot">
        <a id="routeLink" target="_blank" rel="noopener" hidden>Open this route in Google Maps ↗</a>
        <div class="foot-btns">
          <button type="button" class="btn-ghost" id="newTrip">Start a new trip</button>
          <button type="button" class="btn-ghost" id="foldMap">Fold the map</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
